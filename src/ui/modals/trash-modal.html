<!-- Trash — the Recently Deleted sheet. A right-side timeline of deleted
     notes, structure and rendering in src/trash.ts, styles in
     public/css/vercel/20-trash.css (the sheet chrome reuses the History
     sheet's vocabulary — the two read as siblings by design).

     Every entry keeps its note's full record: one click restores it under
     the SAME id (share links survive), the retention clock sweeps the rest
     after 30 days. Deletes inside this sheet are a two-step inline confirm
     on the button itself — nothing here stacks a dialog over the sheet. -->
<div
  id="trashModal"
  class="modal fade snapshots-sheet-host"
  role="dialog"
  aria-labelledby="trashTitle"
>
  <div class="modal-dialog snapshots-sheet">
    <div class="modal-content snapshots-content">
      <header class="snap-head">
        <div class="snap-head-copy">
          <h2 class="snap-title" id="trashTitle">Trash</h2>
          <p class="snap-subtitle">Deleted notes stay here for 30 days.</p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close trash">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <!-- The one scroller: day-anchored timeline, or the empty state. -->
      <div class="snap-scroll">
        <div id="noTrashedNotes" class="snap-empty">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p id="trashEmptyLabel">Nothing in the trash.</p>
          <p class="snap-empty-hint">
            Deleted notes wait here for 30 days before they go for good.
          </p>
        </div>
        <ol id="trashList" class="snap-timeline">
          <!-- Day runs of trash entries render here -->
        </ol>
      </div>

      <footer class="snap-foot">
        <span id="trashCount" class="snap-foot-count">0</span>
        <button id="emptyTrashBtn" class="snap-delete-all" type="button" disabled>
          <svg
            width="13"
            height="13"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="snap-delete-all-label">Empty trash</span>
        </button>
      </footer>
    </div>
  </div>
</div>
