<!-- Snapshots Modal — safety copies of notes; see src/snapshots.ts -->
<div id="snapshotsModal" class="modal fade" role="dialog" aria-labelledby="snapshotsTitle">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div class="pref-header-copy">
          <span class="pref-eyebrow">Padify</span>
          <h4 class="modal-title custom-modal-title" id="snapshotsTitle">Snapshots</h4>
          <p class="pref-subtitle">Safety copies of your notes — restore any version.</p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close snapshots">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="modal-body snapshots-body">
        <!-- The toolbar is pinned — only the list below it scrolls. -->
        <div class="snapshots-toolbar">
          <button id="createSnapshotBtn" class="btn btn-primary snapshots-take-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 5V19M5 12H19"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Take snapshot
            <span class="snapshots-kbd-hint"><kbd data-mod-key>Ctrl</kbd><kbd>U</kbd></span>
          </button>
          <div class="shortcut-search-wrap snapshots-search-wrap">
            <svg
              class="shortcut-search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="searchSnapshots"
              class="shortcut-search-input"
              placeholder="Search snapshots..."
              aria-label="Search snapshots"
            />
            <span id="snapshotSearchMeta" class="snapshots-search-meta" hidden></span>
            <button
              type="button"
              id="clearSnapshotSearch"
              class="snapshots-search-clear"
              aria-label="Clear search"
              hidden
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
            <span class="snapshots-search-slash" aria-hidden="true"><kbd>/</kbd></span>
          </div>
        </div>
        <!-- The scroll area — day-grouped timeline of snapshot rows. -->
        <div class="snapshots-list-container">
          <div id="noSnapshots" class="no-snapshots">
            <svg
              width="44"
              height="44"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M3 12a9 9 0 1 0 3-6.7L3 8"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3 3v5h5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 7v5l3 2"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p id="noSnapshotsEmpty">No snapshots yet.</p>
            <p class="no-snapshots-hint" id="noSnapshotsHint">
              Take one with the button above, or
              <span class="snapshots-kbd-inline"><kbd data-mod-key>Ctrl</kbd> + <kbd>U</kbd></span
              >.
            </p>
            <p id="noSnapshotsMiss" hidden>No matching snapshots.</p>
            <button type="button" id="clearSearchFromEmpty" class="btn snapshots-clear-miss" hidden>
              Clear search
            </button>
          </div>
          <ul id="snapshotsList" class="snapshots-list">
            <!-- Snapshots will be populated here -->
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <div class="snapshots-stats">
          <span id="snapshotsCount">0</span><span class="snapshots-cap">of 200</span>
        </div>
        <div class="snapshots-actions delete-all-container">
          <button id="deleteAllSnapshotsBtn" class="btn snapshots-delete-all" disabled>
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Delete all
          </button>
          <span class="snapshots-footer-sep" aria-hidden="true"></span>
          <button type="button" class="btn snapshots-close" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>
