<!-- History — the one sheet. A right-side timeline answering three
     questions from one toolbar: THIS note's versions (the default —
     the sheet is opened from a note), every note's versions, and the
     trash. Structure and rendering live in src/snapshots.ts, the
     shared row vocabulary in src/ui/sheet-kit.ts, styles in
     public/css/vercel/11-snapshots.css.

     Every view is a day-anchored timeline — time stays the only axis
     within a view. The query is scoped to the view it filters; a miss
     offers the way out of the scope. Rows expand in place into a
     detail card that owns the actions; nothing here opens a second
     dialog. -->
<div
  id="snapshotsModal"
  class="modal fade snapshots-sheet-host"
  role="dialog"
  aria-labelledby="snapshotsTitle"
  tabindex="-1"
>
  <div class="modal-dialog snapshots-sheet">
    <div class="modal-content snapshots-content">
      <header class="snap-head">
        <div class="snap-head-copy">
          <h2 class="snap-title" id="snapshotsTitle">History</h2>
          <p class="snap-subtitle" id="snapshotsSubtitle">Versions of this note.</p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close history">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <!-- Pinned toolbar, two rows — the sheet is 460px wide and one
           row cannot honestly hold a search field, a view switch AND
           the primary action (the field paid for it: it collapsed to a
           sliver). Row one gives the whole width to the search; row
           two splits it between the views (left) and the one primary
           action (right) — browsing together, the action apart. The
           QUERY searches the view it stands in; the trash tab carries
           a count of what waits there. -->
      <div class="snap-toolbar">
        <div class="snap-toolbar-row">
          <div class="snap-search">
            <svg
              class="snap-search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="searchSnapshots"
              class="snap-search-input"
              placeholder="Filter this note..."
              aria-label="Filter this note"
            />
            <span id="snapshotSearchMeta" class="snap-search-meta" aria-live="polite" hidden></span>
            <button
              type="button"
              id="clearSnapshotSearch"
              class="snap-search-clear"
              aria-label="Clear filter"
              hidden
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
            <span class="snap-search-slash" aria-hidden="true"><kbd>/</kbd></span>
          </div>
        </div>
        <div class="snap-toolbar-row">
          <div class="snap-seg" id="snapshotSegment" role="group" aria-label="History view">
            <button
              type="button"
              class="snap-seg-btn is-active"
              data-seg="note"
              aria-pressed="true"
            >
              This note
            </button>
            <button type="button" class="snap-seg-btn" data-seg="all" aria-pressed="false">
              All notes
            </button>
            <button type="button" class="snap-seg-btn" data-seg="trash" aria-pressed="false">
              Trash<span class="snap-seg-count" aria-label="notes in trash" hidden></span>
            </button>
          </div>
          <button
            id="createSnapshotBtn"
            class="snap-take"
            type="button"
            title="Take snapshot"
            data-shortcut-title="mod+u"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 5V19M5 12H19"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Take snapshot
          </button>
        </div>
      </div>

      <!-- The one scroller: the view's day-anchored timeline, or the
           empty state — whose face follows the view (nothing here yet,
           nothing in the trash, nothing of this note yet) and whose
           miss face carries two ways out: drop the query, or carry it
           into the other scope. -->
      <div class="snap-scroll">
        <div id="noSnapshots" class="snap-empty">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3 12a9 9 0 1 0 3-6.7L3 8"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3 3v5h5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 7v5l3 2"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p id="noSnapshotsEmpty">No versions of this note yet.</p>
          <p class="snap-empty-hint" id="noSnapshotsHint">
            Take one with the button above, or
            <span class="snap-kbd-inline"><kbd data-mod-key>Ctrl</kbd> + <kbd>U</kbd></span
            >.
          </p>
          <p class="snap-empty-hint" id="noTrashHint" hidden>
            Deleted notes wait here for 30 days before they go for good.
          </p>
          <p id="noSnapshotsMiss" hidden>Nothing matches.</p>
          <div class="snap-empty-actions" id="noSnapshotsEmptyActions" hidden>
            <button
              type="button"
              id="clearSearchFromEmpty"
              class="snap-clear-miss is-primary"
              hidden
            >
              Clear the filter
            </button>
            <button type="button" id="widenSearchFromEmpty" class="snap-clear-miss" hidden>
              Search all notes
            </button>
          </div>
        </div>
        <ol id="snapshotsList" class="snap-timeline">
          <!-- Day runs of timeline entries render here -->
        </ol>
      </div>

      <footer class="snap-foot">
        <span id="snapshotsCount" class="snap-foot-count">0</span>
        <!-- ONE destructive, scoped to the view it stands in — this
             note's versions, all versions, or the trash. The label and
             its armed question follow the view (snapshots.ts owns the
             mapping); the two-step confirm lives on the button. -->
        <span class="snap-foot-actions">
          <button id="historyScopeDeleteBtn" class="snap-delete-all" type="button" hidden>
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="snap-delete-all-label">Delete this note's versions</span>
          </button>
        </span>
      </footer>
    </div>
  </div>
</div>
