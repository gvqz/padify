<!-- History — the one sheet. A right-side timeline where safety copies
     (versions) and deleted notes (trash entries) share a single
     chronology; structure and rendering live in src/snapshots.ts, the
     shared row vocabulary in src/ui/sheet-kit.ts, styles in
     public/css/vercel/11-snapshots.css.

     One continuous timeline — time is the only axis and each day anchors
     its own run of the rail. The segmented filter (All · Versions ·
     Trash) narrows it without reordering it; the search field covers
     both kinds. Rows expand in place into a detail card that owns the
     actions; nothing here opens a second dialog. -->
<div
  id="snapshotsModal"
  class="modal fade snapshots-sheet-host"
  role="dialog"
  aria-labelledby="snapshotsTitle"
>
  <div class="modal-dialog snapshots-sheet">
    <div class="modal-content snapshots-content">
      <header class="snap-head">
        <div class="snap-head-copy">
          <h2 class="snap-title" id="snapshotsTitle">History</h2>
          <p class="snap-subtitle">Versions and deleted notes — one timeline.</p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close history">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <!-- Pinned toolbar, two rows — the sheet is 460px wide and one
           row cannot honestly hold a search field, a segmented filter
           AND the primary action (the field paid for it: it collapsed
           to a sliver). Row one gives the whole width to the search;
           row two splits it between the segment filter (left) and the
           one primary action (right) — filters together, the action
           apart. The segment narrows the timeline to one kind of row;
           it never reorders it — time stays the only axis. -->
      <div class="snap-toolbar">
        <div class="snap-toolbar-row">
          <div class="snap-search">
            <svg
              class="snap-search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input
              type="text"
              id="searchSnapshots"
              class="snap-search-input"
              placeholder="Filter history..."
              aria-label="Filter history"
            />
            <span id="snapshotSearchMeta" class="snap-search-meta" hidden></span>
            <button
              type="button"
              id="clearSnapshotSearch"
              class="snap-search-clear"
              aria-label="Clear filter"
              hidden
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
            <span class="snap-search-slash" aria-hidden="true"><kbd>/</kbd></span>
          </div>
        </div>
        <div class="snap-toolbar-row">
          <div class="snap-seg" id="snapshotSegment" role="group" aria-label="Timeline filter">
            <button type="button" class="snap-seg-btn is-active" data-seg="all" aria-pressed="true">
              All
            </button>
            <button type="button" class="snap-seg-btn" data-seg="versions" aria-pressed="false">
              Versions
            </button>
            <button type="button" class="snap-seg-btn" data-seg="trash" aria-pressed="false">
              Trash
            </button>
          </div>
          <button
            id="createSnapshotBtn"
            class="snap-take"
            type="button"
            title="Take snapshot"
            data-shortcut-title="mod+u"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 5V19M5 12H19"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Take snapshot
          </button>
        </div>
      </div>

      <!-- The one scroller: day-anchored timeline, or the empty state. -->
      <div class="snap-scroll">
        <div id="noSnapshots" class="snap-empty">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3 12a9 9 0 1 0 3-6.7L3 8"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M3 3v5h5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 7v5l3 2"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p id="noSnapshotsEmpty">Nothing here yet.</p>
          <p class="snap-empty-hint" id="noSnapshotsHint">
            Take one with the button above, or
            <span class="snap-kbd-inline"><kbd data-mod-key>Ctrl</kbd> + <kbd>U</kbd></span
            >. Trashed notes wait here too.
          </p>
          <p class="snap-empty-hint" id="noTrashHint" hidden>
            Deleted notes wait here for 30 days before they go for good.
          </p>
          <p id="noSnapshotsMiss" hidden>Nothing matches.</p>
          <button type="button" id="clearSearchFromEmpty" class="snap-clear-miss" hidden>
            Clear the filter
          </button>
        </div>
        <ol id="snapshotsList" class="snap-timeline">
          <!-- Day runs of timeline entries render here -->
        </ol>
      </div>

      <footer class="snap-foot">
        <span id="snapshotsCount" class="snap-foot-count">0</span>
        <span class="snap-foot-actions">
          <button id="emptyTrashBtn" class="snap-delete-all" type="button" hidden>
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="snap-delete-all-label">Empty trash</span>
          </button>
          <button id="deleteAllSnapshotsBtn" class="snap-delete-all" type="button" disabled>
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="snap-delete-all-label">Delete all versions</span>
          </button>
        </span>
      </footer>
    </div>
  </div>
</div>
