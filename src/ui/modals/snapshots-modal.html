    <!-- Snapshots Modal -->
    <div id="snapshotsModal" class="modal fade" role="dialog">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">
              Snapshots
              <a
                href="#"
                data-toggle="tooltip"
                data-placement="right"
                title="Snapshots are manually saved versions of your notes that you can restore later."
              >
                <img src="/img/tooltip.svg" alt="Tooltip Icon" />
              </a>
            </h4>
          </div>
          <div class="modal-body">
            <div class="snapshots-actions search-container">
              <button id="createSnapshotBtn" class="btn btn-primary">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M12 5V19M5 12H19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
                Take Snapshot [ctrl/command + u]
              </button>
              <div class="search-snapshots">
                <input
                  type="text"
                  id="searchSnapshots"
                  class="form-control"
                  placeholder="Search snapshots..."
                />
              </div>
            </div>
            <div class="snapshots-list-container">
              <div id="noSnapshots" class="no-snapshots">
                <svg
                  width="64"
                  height="64"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                  <g id="SVGRepo_iconCarrier">
                    <path
                      d="M4 12H20M12 4V20"
                      stroke="#6b6b6b"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </g>
                </svg>
                <p>No snapshots yet.</p>
              </div>
              <ul id="snapshotsList" class="snapshots-list">
                <!-- Snapshots will be populated here -->
              </ul>
            </div>
          </div>
          <div class="modal-footer">
            <div class="snapshots-stats"><span id="snapshotsCount">0</span> snapshots</div>
            <div class="snapshots-actions delete-all-container">
              <button id="deleteAllSnapshotsBtn" class="btn btn-danger" disabled>
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M19 7L18.1327 19.1425C18.0579 20.1891 17.187 21 16.1378 21H7.86224C6.81296 21 5.94208 20.1891 5.86732 19.1425L5 7M10 11V17M14 11V17M15 7V4C15 3.44772 14.5523 3 14 3H10C9.44772 3 9 3.44772 9 4V7M4 7H20"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Delete All
              </button>
              <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
