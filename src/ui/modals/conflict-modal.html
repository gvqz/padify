<!-- Version review — the conflict sheet. Opens from a strip badge or the
     note menu when a note changed on two devices and the merge could not
     reconcile the overlap. Structure and rendering live in
     src/conflicts.ts, styles in public/css/vercel/20-tracked-changes.css (the sheet
     chrome reuses the History sheet's vocabulary — sibling by design).

     One document, tracked-changes style: this device's words struck
     through and dimmed where the current version dropped them, the other
     version's words tinted green where it added them. Three ways out, no
     dialog stacked over the sheet. -->
<div
  id="conflictModal"
  class="modal fade snapshots-sheet-host"
  role="dialog"
  aria-labelledby="conflictTitle"
>
  <div class="modal-dialog snapshots-sheet">
    <div class="modal-content snapshots-content">
      <header class="snap-head">
        <div class="snap-head-copy">
          <h2 class="snap-title" id="conflictTitle">Two versions of this note</h2>
          <p class="snap-subtitle" id="conflictSubtitle">
            It changed on another device while this one had unsynced edits.
          </p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close review">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <!-- The tracked-changes body: the note's CURRENT version (theirs,
           the one the row took) with this device's parked words marked.
           Legend first — the marks carry the whole meaning; its rows are
           rendered to match what the diff actually shows. -->
      <div class="snap-scroll">
        <div id="conflictLegend" class="conflict-legend"></div>
        <div id="conflictDiff" class="conflict-diff" aria-live="polite"></div>
        <p class="conflict-meta" id="conflictMeta"></p>
      </div>

      <footer class="snap-foot conflict-actions">
        <button type="button" class="snap-act restore" data-conflict-resolution="mine">
          Restore my version
        </button>
        <button type="button" class="snap-act ghost" data-conflict-resolution="both">
          Keep both
        </button>
        <button type="button" class="snap-act ghost" data-conflict-resolution="theirs">
          Keep current
        </button>
      </footer>
    </div>
  </div>
</div>
