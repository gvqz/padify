<!-- Share — a topbar panel that hangs from the share icon. A share is a
     key you hand out: the panel reads top to bottom as WHAT you are
     sharing (the note strip, with the type's own glyph), HOW LONG the
     key works (the expiry choice and the one primary action), and WHICH
     keys are already out there (the links list, each row owning its own
     Open / Copy / Cancel). It hovers without a backdrop and closes on
     outside click or Escape; under 640px it becomes a bottom sheet.
     Structure and rendering live in src/cloud/share-ui.ts, styles in
     public/css/vercel/19-panels.css. Nothing here opens a second
     dialog — cancelling a link arms its own button in place. -->
<div
  id="shareModal"
  class="topbar-panel share-panel"
  tabindex="-1"
  role="dialog"
  aria-labelledby="shareModalTitle"
>
  <div class="share-panel-body">
    <header class="share-head">
      <div class="share-head-copy">
        <h2 class="share-title" id="shareModalTitle">Share</h2>
        <p class="share-subtitle">Read-only links to this note — you keep the pen.</p>
      </div>
      <button type="button" class="share-close" data-dismiss="panel" aria-label="Close share">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <!-- Signed out: sharing is a cloud-account feature. The gate is one
         quiet block — mark, one sentence, one way forward. -->
    <div id="shareSignedOutPane" hidden>
      <div class="share-gate">
        <span class="share-gate-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <h5 class="share-gate-title">Sign in to share notes</h5>
        <p class="share-gate-copy">
          Sharing creates a private read-only link to this note that you can cancel at any time.
        </p>
        <button type="button" class="share-gate-cta" id="shareSignInCta">Sign in</button>
      </div>
    </div>

    <div id="shareSignedInPane" hidden>
      <!-- What is being shared: a slim strip, the type's own glyph up
           front. It goes dashed and says why when the note has nothing
           to share. -->
      <section class="share-note-strip" id="shareNoteCard" aria-label="The note being shared">
        <span class="share-note-glyph" id="shareNoteGlyph" aria-hidden="true"></span>
        <div class="share-note-copy">
          <span class="share-note-title" id="shareNoteTitle">Untitled</span>
          <span class="share-note-meta-line">
            <span class="share-note-meta" id="shareNoteMeta"></span>
            <span class="share-note-type-chip" id="shareNoteTypeChip" hidden></span>
          </span>
        </div>
      </section>

      <!-- The one primary movement: pick how long the link lives, create
           it. The preview line says the exact date so the choice is never
           abstract. -->
      <section class="share-new" aria-label="Create a new link">
        <span class="share-sec-label" id="shareDurationLabel">New link expires after</span>
        <div class="share-dur" role="radiogroup" aria-labelledby="shareDurationLabel">
          <input type="radio" id="shareDur1" value="1" name="shareDuration" />
          <label for="shareDur1">1 day</label>
          <input type="radio" id="shareDur7" value="7" name="shareDuration" checked />
          <label for="shareDur7">7 days</label>
          <input type="radio" id="shareDur30" value="30" name="shareDuration" />
          <label for="shareDur30">30 days</label>
          <input type="radio" id="shareDur90" value="90" name="shareDuration" />
          <label for="shareDur90">90 days</label>
        </div>
        <span class="share-expiry-preview" id="shareExpiryPreview"></span>
        <button type="button" class="share-create" id="shareCreateBtn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span class="share-create-label">Create link</span>
        </button>
      </section>

      <!-- The keys already handed out. The count chip lives in the head;
           the scope narrows the list to this note or spans every link the
           account owns; a row never opens a dialog — cancelling arms the
           row's own button. -->
      <section class="share-links" aria-label="Existing links">
        <div class="share-links-head">
          <span class="share-links-title">Your links</span>
          <span class="share-links-count" id="shareLinkCount" hidden></span>
          <div class="share-scope" role="radiogroup" aria-label="Which links to show">
            <input type="radio" id="shareScopeNote" value="note" name="shareScope" checked />
            <label for="shareScopeNote">This note</label>
            <input type="radio" id="shareScopeAll" value="all" name="shareScope" />
            <label for="shareScopeAll">All notes</label>
          </div>
        </div>
        <div class="share-links-list" id="shareLinksList">
          <!-- Link rows render here -->
        </div>
      </section>
    </div>
  </div>
</div>
