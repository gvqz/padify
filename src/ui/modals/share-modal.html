<!-- Share — a topbar panel that hangs from the share icon, plus its
     companion popup: the links panel. The share panel is the ACT of
     sharing one note — a note gets ONE active link (a second create
     updates or copies the first, never duplicates it), the expiry choice
     sits above the one primary button, and the active link, when there
     is one, shows as a card with Copy / Cancel on it. Everything
     list-shaped lives next door: the "All links" row opens a second
     popup (anchored to the same icon) with every ACTIVE link across the
     account — cancelled and expired ones are gone, not dimmed. Both
     panels hover without a backdrop and close on outside click or
     Escape; under 640px they become bottom sheets. Structure and
     rendering live in src/cloud/share-ui.ts, styles in
     public/css/vercel/19-panels.css. Nothing here opens a dialog —
     cancelling a link arms its own button in place. -->
<div
  id="shareModal"
  class="topbar-panel share-panel"
  tabindex="-1"
  role="dialog"
  aria-labelledby="shareModalTitle"
>
  <div class="share-panel-body">
    <header class="share-head">
      <div class="share-head-copy">
        <h2 class="share-title" id="shareModalTitle">Share</h2>
      </div>
      <button type="button" class="share-close" data-dismiss="panel" aria-label="Close share">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <!-- Signed out: sharing is a cloud-account feature. The gate is one
         quiet block — mark, one sentence, one way forward. -->
    <div id="shareSignedOutPane" hidden>
      <div class="share-gate">
        <span class="share-gate-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <h5 class="share-gate-title">Sign in to share notes</h5>
        <button type="button" class="share-gate-cta" id="shareSignInCta">Sign in</button>
      </div>
    </div>

    <div id="shareSignedInPane" hidden>
      <!-- The note's one active link, when it exists — the card IS the
           dedupe: with a live link on the note, the button below updates
           its expiry instead of minting a twin, and Copy / Cancel ride
           the card itself. -->
      <section
        class="share-active"
        id="shareActiveCard"
        aria-label="This note's active link"
        hidden
      >
        <div class="share-active-top">
          <span class="share-active-name">Active link</span>
          <span class="share-badge active">Active</span>
        </div>
        <div class="share-active-foot">
          <span class="share-active-meta" id="shareActiveMeta"></span>
          <div class="share-active-actions">
            <button type="button" class="share-chip-btn" id="shareActiveCopy">Copy</button>
            <button type="button" class="share-chip-btn danger" id="shareActiveCancel">
              Cancel link
            </button>
          </div>
        </div>
        <span class="sr-only" id="shareActiveUrl"></span>
      </section>

      <!-- The one primary movement: pick how long the link lives, create
           it — or, with a link already out, refresh its window instead
           (the label follows the state). The quiet line says why an
           empty note cannot share. -->
      <section class="share-new" aria-label="Create or update the link">
        <div class="share-dur" role="radiogroup" aria-label="Link expires after">
          <input type="radio" id="shareDur1" value="1" name="shareDuration" />
          <label for="shareDur1">1 day</label>
          <input type="radio" id="shareDur7" value="7" name="shareDuration" checked />
          <label for="shareDur7">7 days</label>
          <input type="radio" id="shareDur30" value="30" name="shareDuration" />
          <label for="shareDur30">30 days</label>
          <input type="radio" id="shareDur90" value="90" name="shareDuration" />
          <label for="shareDur90">90 days</label>
        </div>
        <button type="button" class="share-create" id="shareCreateBtn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span class="share-create-label">Create link</span>
        </button>
        <p class="share-empty-line" id="shareEmptyLine" hidden>
          This note is empty — write something first.
        </p>
      </section>

      <!-- The door to the links popup: every active link across the
           account, each row carrying its own Open / Copy / Cancel. -->
      <button type="button" class="share-all-links" id="shareAllLinks">
        <span class="share-all-links-label">All links</span>
        <span class="share-links-count" id="shareLinkCount" hidden></span>
        <svg
          class="share-all-links-chevron"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- The links popup — where the list lives now. Active links only: a
     cancelled or expired link leaves the list instead of haunting it.
     The scope narrows it to this note or spans the account; a row never
     opens a dialog — cancelling arms the row's own button. -->
<div
  id="shareLinksPanel"
  class="topbar-panel share-panel share-links-panel"
  tabindex="-1"
  role="dialog"
  aria-labelledby="shareLinksTitle"
>
  <div class="share-panel-body">
    <header class="share-head">
      <div class="share-head-copy">
        <h2 class="share-title" id="shareLinksTitle">Your links</h2>
      </div>
      <span class="share-links-count share-links-count-head" id="sharePopupCount" hidden></span>
      <button type="button" class="share-close" data-dismiss="panel" aria-label="Close links">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <section class="share-links" aria-label="Active links">
      <div class="share-links-head">
        <div class="share-scope" role="radiogroup" aria-label="Which links to show">
          <input type="radio" id="shareScopeNote" value="note" name="shareScope" checked />
          <label for="shareScopeNote">This note</label>
          <input type="radio" id="shareScopeAll" value="all" name="shareScope" />
          <label for="shareScopeAll">All notes</label>
        </div>
      </div>
      <div class="share-links-list" id="shareLinksList">
        <!-- Link rows render here -->
      </div>
    </section>
  </div>
</div>
