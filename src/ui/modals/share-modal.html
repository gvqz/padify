<!-- Share — a topbar panel that hangs from the share icon. The panel is
     the ACT of sharing one note, remade as a link card:

       • the head names the model ("anyone with the link can view");
       • the signed-in pane opens with a NOTE STRIP — the type glyph and
         the live title of the note being shared, so the panel always
         says WHAT it is sharing;
       • a note with a live link shows it as a FIELD: the URL itself,
         selectable (click = select all), with a copy button that flips
         to a green check, a status line (Active badge + countdown) and
         quiet actions — Open (see the page the reader sees), Share via…
         (the OS share sheet, when the browser has one) and Cancel link
         (two-step, the confirm state IS the button);
       • the expiry picker is a segmented track with a live hint line
         under it that names the date the link will actually work until
         ("Same URL — works until Nov 27, 2026" in update mode);
       • one primary button follows the state: Create link, or Update
         expiration when the note's one link is already out.

     A note keeps ONE active link — a second create updates or copies
     the first, never duplicates it. There is no list here: every link
     across the account lives in Settings → Cloud sync (the "Shared
     links" card). The panel hovers without a backdrop and closes on
     outside click or Escape; under 640px it becomes a bottom sheet.
     Structure and rendering live in src/cloud/share-ui.ts, styles in
     public/css/vercel/19-panels.css. Nothing here opens a dialog —
     cancelling a link arms its own button in place. -->
<div
  id="shareModal"
  class="topbar-panel share-panel"
  tabindex="-1"
  role="dialog"
  aria-labelledby="shareModalTitle"
>
  <div class="share-panel-body">
    <header class="share-head">
      <div class="share-head-copy">
        <h2 class="share-title" id="shareModalTitle">Share</h2>
        <p class="share-head-sub">Anyone with the link can view this note.</p>
      </div>
      <button type="button" class="share-close" data-dismiss="panel" aria-label="Close share">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <!-- Signed out: sharing is a cloud-account feature. The gate is one
         quiet block — mark, one sentence, one way forward. -->
    <div id="shareSignedOutPane" hidden>
      <div class="share-gate">
        <span class="share-gate-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <h5 class="share-gate-title">Sign in to share notes</h5>
        <p class="share-gate-line">
          Links hand out a read-only copy that follows your edits and expires on its own.
        </p>
        <button type="button" class="share-gate-cta" id="shareSignInCta">Sign in</button>
      </div>
    </div>

    <div id="shareSignedInPane" hidden>
      <!-- The note being shared — the type glyph the rail uses, plus the
           note's live title, so the panel names its subject even before
           a link exists. -->
      <div class="share-note-strip">
        <span class="share-note-glyph" id="shareNoteGlyph" aria-hidden="true"></span>
        <span class="share-note-name" id="shareNoteName"></span>
      </div>

      <!-- The note's one active link, when it exists — the field IS the
           dedupe made visible: with a link out, the button below updates
           its expiry instead of minting a twin, Copy rides the field,
           and Open / Share via… / Cancel ride the card. -->
      <section
        class="share-active"
        id="shareActiveCard"
        aria-label="This note's active link"
        hidden
      >
        <div class="share-field">
          <span class="share-field-url" id="shareActiveUrl"></span>
          <button
            type="button"
            class="share-field-copy"
            id="shareActiveCopy"
            aria-label="Copy link"
            title="Copy link"
          >
            <svg class="share-copy-idle" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <svg class="share-copy-done" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
        </div>
        <div class="share-status">
          <span class="share-badge active">Active</span>
          <span class="share-active-meta" id="shareActiveMeta"></span>
        </div>
        <div class="share-active-actions">
          <button type="button" class="share-chip-btn" id="shareActiveOpen">Open</button>
          <button type="button" class="share-chip-btn" id="shareActiveNative" hidden>
            Share via…
          </button>
          <span class="spacer" aria-hidden="true"></span>
          <button type="button" class="share-chip-btn danger" id="shareActiveCancel">
            Cancel link
          </button>
        </div>
      </section>

      <!-- The one primary movement: pick how long the link lives, create
           it — or, with a link already out, refresh its window instead
           (the label follows the state). The hint line names the real
           date the pick produces, and the quiet refusal under the button
           says why an empty note cannot share. -->
      <section class="share-new" aria-label="Create or update the link">
        <div class="share-expiry-label" id="shareExpiryLabel">Expires after</div>
        <div class="share-dur" role="radiogroup" aria-label="Link expires after">
          <input type="radio" id="shareDur1" value="1" name="shareDuration" />
          <label for="shareDur1">1 day</label>
          <input type="radio" id="shareDur7" value="7" name="shareDuration" checked />
          <label for="shareDur7">7 days</label>
          <input type="radio" id="shareDur30" value="30" name="shareDuration" />
          <label for="shareDur30">30 days</label>
          <input type="radio" id="shareDur90" value="90" name="shareDuration" />
          <label for="shareDur90">90 days</label>
        </div>
        <p class="share-dur-hint" id="shareDurHint" aria-live="polite"></p>
        <button type="button" class="share-create" id="shareCreateBtn">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span class="share-create-label">Create link</span>
        </button>
        <p class="share-empty-line" id="shareEmptyLine" hidden>
          This note is empty — write something first.
        </p>
      </section>
    </div>
  </div>
</div>
