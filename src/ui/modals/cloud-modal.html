<!-- Cloud sync — a topbar panel that hangs from its own cloud icon.
     Sync is a STATUS surface, not a document: signed out, it is a compact
     sign-in; signed in, it is a live status block (state word, last sync,
     sync-now) over the account row. The panel hovers without a backdrop
     and closes on outside click or Escape; under 640px it becomes a
     bottom sheet. Structure and rendering live in src/cloud/ui.ts,
     styles in public/css/vercel/19-panels.css. -->
<div
  id="cloudModal"
  class="topbar-panel cloud-panel"
  tabindex="-1"
  role="dialog"
  aria-labelledby="cloudPanelTitle"
>
  <div class="cloud-panel-body">
    <!-- Signed in: the live status block IS the headline. The mark's
         ring carries the state color; the sync-now button spins while a
         sync is in flight. -->
    <div id="cloudSignedInPane" hidden>
      <div class="cloud-hero cloud-hero-status">
        <span class="cloud-mark is-state" id="cloudModalStatusDot" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6.5 6.5 0 0 0-12.7 1.61A4 4 0 0 0 6 19.5h11.5"
            />
          </svg>
        </span>
        <div class="cloud-hero-copy">
          <h2 class="cloud-hero-title" id="cloudStatusLine">Everything is backed up</h2>
          <p class="cloud-hero-meta" id="cloudLastSync">Syncing for the first time…</p>
        </div>
        <button
          type="button"
          class="cloud-sync-btn"
          id="cloudSyncNow"
          title="Sync now"
          aria-label="Sync now"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
        </button>
      </div>

      <div class="cloud-account">
        <span class="cloud-avatar" id="cloudAccountAvatar" aria-hidden="true"></span>
        <div class="cloud-account-copy">
          <span class="cloud-account-email" id="cloudAccountEmail"></span>
        </div>
        <button type="button" class="cloud-quiet-btn" id="cloudSignOut">Sign out</button>
      </div>
    </div>

    <!-- Signed out: the compact sign-in. The form keeps the classic
         ids — cloudAuthForm / Email / Password / Submit / Switch — the
         wiring and the e2e contracts ride on them. -->
    <div id="cloudAuthPane">
      <div class="cloud-hero">
        <span class="cloud-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6.5 6.5 0 0 0-12.7 1.61A4 4 0 0 0 6 19.5h11.5"
            />
            <path d="M12 12v6" />
            <path d="m9.5 15.5 2.5-2.5 2.5 2.5" />
          </svg>
        </span>
        <div class="cloud-hero-copy">
          <h2 class="cloud-hero-title" id="cloudPanelTitle">Cloud sync</h2>
          <p class="cloud-hero-meta">
            Sign in to back up your notes and pick them up on any device.
          </p>
        </div>
      </div>

      <form id="cloudAuthForm" class="cloud-auth" novalidate>
        <div class="cloud-field">
          <label class="cloud-label" for="cloudAuthEmail">Email</label>
          <input
            type="email"
            class="cloud-input"
            id="cloudAuthEmail"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
            data-panel-autofocus
          />
        </div>
        <div class="cloud-field">
          <label class="cloud-label" for="cloudAuthPassword">Password</label>
          <input
            type="password"
            class="cloud-input"
            id="cloudAuthPassword"
            name="password"
            autocomplete="current-password"
            placeholder="At least 6 characters"
            required
            minlength="6"
          />
        </div>
        <p class="cloud-feedback cloud-error" id="cloudAuthError" role="alert" hidden></p>
        <p class="cloud-feedback cloud-notice" id="cloudAuthNotice" hidden></p>
        <button type="submit" class="cloud-submit" id="cloudAuthSubmit">Sign in</button>
        <div class="cloud-auth-links">
          <a href="#cloudAuthSwitch" id="cloudAuthSwitch">New here? Create an account</a>
        </div>
      </form>
    </div>
  </div>
</div>
