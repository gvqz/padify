<!-- The "changed while you were away" peek. Opens once, over a note that
     just switched to, when its words arrived from another device while it
     sat unopened (see tabs.ts — NoteTab.unseenChange). Structure and
     rendering in src/unseen.ts, styles in public/css/vercel/20-tracked-changes.css
     (the tracked-changes body and sheet chrome are the review sheet's
     vocabulary — sibling by design).

     One document, tracked-changes style: words no longer there struck
     through and dimmed, words added since the last open tinted green.
     Nothing to decide — the note already carries the new version; the
     peek only answers "what changed?". One way out. -->
<div
  id="unseenModal"
  class="modal fade snapshots-sheet-host"
  role="dialog"
  aria-labelledby="unseenTitle"
>
  <div class="modal-dialog snapshots-sheet">
    <div class="modal-content snapshots-content">
      <header class="snap-head">
        <div class="snap-head-copy">
          <h2 class="snap-title" id="unseenTitle">Changed while you were away</h2>
          <p class="snap-subtitle" id="unseenSubtitle">
            This note was edited on another device since you last opened it here.
          </p>
        </div>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close peek">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <!-- The tracked-changes body: the note's CURRENT version with the
           delta since the last open marked. Legend first — the marks carry
           the whole meaning; its rows are rendered to match what the diff
           actually shows (a peek with no removals never mentions strikes). -->
      <div class="snap-scroll">
        <div id="unseenLegend" class="conflict-legend"></div>
        <div id="unseenDiff" class="conflict-diff" aria-live="polite"></div>
        <p class="conflict-meta" id="unseenMeta"></p>
      </div>

      <footer class="snap-foot conflict-actions">
        <button type="button" class="snap-act ghost" data-dismiss="modal">Close</button>
      </footer>
    </div>
  </div>
</div>
