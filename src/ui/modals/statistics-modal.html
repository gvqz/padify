<!-- Stats modal -->
<div id="statisticsModal" class="modal fade" role="dialog">
  <div class="modal-dialog modal-lg">
    <!-- Modal content-->
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <h4 class="modal-title custom-modal-title">Statistics</h4>
      </div>
      <div class="modal-body modal-container">
        <p class="statistics-hint" data-stat-hint>Click a card to cycle through its statistics.</p>
        <div class="statistics-board" id="statisticsBoard">
          <button
            type="button"
            class="stat-card stat-card-hero"
            data-stat-family="count"
            title="Click to cycle: characters, words, sentences, paragraphs"
          >
            <span class="stat-label" data-stat-label>Characters</span>
            <span class="stat-value" data-stat-value>0</span>
          </button>
          <button
            type="button"
            class="stat-card"
            data-stat-family="vocabulary"
            title="Click to cycle: unique words, most common word, average word length, words per sentence"
          >
            <span class="stat-label" data-stat-label>Unique words</span>
            <span class="stat-value" data-stat-value>0</span>
          </button>
          <button
            type="button"
            class="stat-card"
            data-stat-family="time"
            title="Click to cycle: reading time, speaking time, writing time"
          >
            <span class="stat-label" data-stat-label>Reading time</span>
            <span class="stat-value" data-stat-value>0 min</span>
          </button>
          <button
            type="button"
            class="stat-card"
            data-stat-family="records"
            title="Click to cycle: longest word, longest sentence"
          >
            <span class="stat-label" data-stat-label>Longest word</span>
            <span class="stat-value" data-stat-value>N/A</span>
          </button>
          <button
            type="button"
            class="stat-card"
            data-stat-family="quality"
            title="Click to cycle: readability score, lexical density, estimated pages"
          >
            <span class="stat-label" data-stat-label>Readability score</span>
            <span class="stat-value" data-stat-value>0.0</span>
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
