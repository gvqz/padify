    <div id="mainContainer">
      <div id="editorShell">
        <aside id="tabRail" aria-label="Note tabs">
          <div class="tab-rail-head">
            <span class="tab-rail-eyebrow">Notes</span>
            <span class="tab-rail-count" id="tabRailCount" title="Notes on this device">1</span>
          </div>
          <div id="tabStrip" role="tablist" aria-orientation="vertical" aria-label="Note tabs">
            <div id="tabStripTabs" class="tab-strip-tabs"></div>
          </div>
          <div class="tab-rail-foot">
            <button
              type="button"
              id="addTab"
              class="tab-rail-add"
              title="New tab"
              aria-label="Add a new tab"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>New note</span>
            </button>
          </div>
        </aside>
        <div id="tabRailBackdrop" class="tab-rail-backdrop" aria-hidden="true"></div>
        <div class="container" id="textareaContainer">
          <div class="starter-template">
            <div
              id="note"
              contenteditable="true"
              spellcheck="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Your notes"
              data-placeholder="Type your notes here and when you come back all your notes will be right here..."
            ></div>
            <!-- this should soon be an animated and rotating text messages, not static and boring  -->
          </div>
          <div class="bottom-line">
            <div class="save-state" id="saveState" hidden>
              <span class="save-state-spinner" aria-hidden="true"></span>
              <svg
                class="save-state-check"
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m5 13 4 4L19 7" />
              </svg>
              <span class="save-state-text">Saved</span>
            </div>
            <div class="timer-pill" style="display: none">
              <div class="timer-display">00:00</div>
              <a href="javascript:void(0);" id="stopTimer" title="Stop the timer">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="#000"
                  class="size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                  />
                </svg>
              </a>
            </div>
            <div class="word-count-container">
              <p id="wordCount">0 character • 0 word</p>
              <a
                href="#statistics"
                data-toggle="modal"
                data-target="#statisticsModal"
                title="View Note Statistics"
              >
                <svg
                  width="10"
                  height="10"
                  viewBox="-3 0 32 32"
                  version="1.1"
                  xmlns="http://www.w3.org/2000/svg"
                  xmlns:xlink="http://www.w3.org/1999/xlink"
                  xmlns:sketch="http://www.bohemiancoding.com/sketch/ns"
                  fill="currentColor"
                  stroke="#000000"
                >
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                  <g id="SVGRepo_iconCarrier">
                    <title>View Note Statistics</title>
                    <defs></defs>
                    <g
                      id="Page-1"
                      stroke="none"
                      stroke-width="1"
                      fill="none"
                      fill-rule="evenodd"
                      sketch:type="MSPage"
                    >
                      <g
                        id="Icon-Set-Filled"
                        sketch:type="MSLayerGroup"
                        transform="translate(-314.000000, -673.000000)"
                        fill="currentColor"
                      >
                        <path
                          d="M328,673 L326,673 C324.896,673 324,673.896 324,675 L324,703 C324,704.104 324.896,705 326,705 L328,705 C329.104,705 330,704.104 330,703 L330,675 C330,673.896 329.104,673 328,673 L328,673 Z M338,689 L336,689 C334.896,689 334,689.896 334,691 L334,703 C334,704.104 334.896,705 336,705 L338,705 C339.104,705 340,704.104 340,703 L340,691 C340,689.896 339.104,689 338,689 L338,689 Z M318,682 L316,682 C314.896,682 314,682.896 314,684 L314,703 C314,704.104 314.896,705 316,705 L318,705 C319.104,705 320,704.104 320,703 L320,684 C320,682.896 319.104,682 318,682 L318,682 Z"
                          id="stats"
                          sketch:type="MSShapeGroup"
                        ></path>
                      </g>
                    </g>
                  </g>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
