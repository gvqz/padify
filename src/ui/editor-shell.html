<div id="mainContainer">
  <div id="editorShell">
    <aside id="tabRail" aria-label="Note tabs">
      <div class="tab-rail-head">
        <span class="tab-rail-eyebrow">Notes</span>
        <span class="tab-rail-head-tools">
          <span class="tab-rail-count" id="tabRailCount" title="Notes on this device">1</span>
          <button
            type="button"
            class="tab-rail-calendar"
            id="tabRailCalendar"
            title="Calendar — every reminder, one grid"
            aria-label="Open the reminders calendar"
            aria-expanded="false"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
              <path d="M8 3v4M16 3v4M3.5 10h17" />
            </svg>
            <!-- today-count badge, filled by the tasks rail -->
            <span class="tab-rail-calendar-dot" id="tabRailCalendarDot" hidden></span>
          </button>
        </span>
      </div>
      <div id="tabStrip" role="tablist" aria-orientation="vertical" aria-label="Note tabs">
        <div id="tabStripTabs" class="tab-strip-tabs"></div>
      </div>
      <div class="tab-rail-foot">
        <div class="tab-rail-add-group">
          <button
            type="button"
            id="addTab"
            class="tab-rail-add"
            title="New note"
            aria-label="Add a new note"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>New note</span>
          </button>
          <button
            type="button"
            id="addTabTypeMenu"
            class="tab-rail-add-type"
            title="Choose a note type"
            aria-label="Choose a note type"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="addTabTypeMenuPopover"
          >
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <div
          id="addTabTypeMenuPopover"
          class="tab-type-menu"
          role="menu"
          aria-label="Note type"
          hidden
        ></div>
      </div>
    </aside>

    <!-- The Reminders rail — the tasks side of the app. It appears ONLY in
         task contexts (a task list note open, or a Reminders page): a thin
         icon strip at rest, hover/pin expands it to the destinations
         (Today / Scheduled / All / Flagged / Completed / Calendar) plus
         search. The lists themselves live in the notes rail — they ARE
         notes — so this rail never repeats them. -->
    <aside id="taskRail" aria-label="Reminders">
      <div class="tr-rail-head">
        <span class="tr-eyebrow">
          <svg
            width="15"
            height="15"

          width="15"

            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div class="tr-scroll">
        <div class="tr-cards" role="tablist" aria-label="Reminders views">

            type="button"
            class="tr-card"
            data-view="today"
            role="tab"
            aria-selected="false"
            title="Today"

            <span class="tr-card-label">Today</span>
          </button>

            type="button"
            class="tr-card"
            data-view="scheduled"

            aria-selected="false"

                <path d="M12 7.5V12l3 2" /></svg

            <span class="tr-card-count" data-count="flagged"></span>
            <span class="tr-card-label">Flagged</span>
