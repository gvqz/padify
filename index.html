    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Padify is an offline-capable notepad powered by ServiceWorker. It's quick, distraction-free, dark mode enabled, mobile compatible(Android, iOS) and minimalist in nature."
    />
    <meta name="keywords" content="padify,note,offline,mobile,web,notepad,android,ios,desktop" />
    <meta name="application-name" content="Padify" />
    <!--
      Stylesheets, in strict cascade order: the vendored Bootstrap fork,
      then the app areas split out of the old monolithic style.css
      (base -> editor -> navbar -> components -> timer -> effects ->
      switches -> animations -> fonts), then the feature stylesheets and
      the vercel design system last — mirroring the pre-split order.
    -->
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/base.css" rel="stylesheet" />
    <link href="/css/editor.css" rel="stylesheet" />
    <link href="/css/navbar.css" rel="stylesheet" />
    <link href="/css/components.css" rel="stylesheet" />
    <link href="/css/timer.css" rel="stylesheet" />
    <link href="/css/effects.css" rel="stylesheet" />
    <link href="/css/switches.css" rel="stylesheet" />
    <link href="/css/animations.css" rel="stylesheet" />
    <link href="/css/fonts.css" rel="stylesheet" />
    <link href="/css/modals.css" rel="stylesheet" />
    <link href="/css/snapshots.css" rel="stylesheet" />
    <link href="/css/unicode-picker.css" rel="stylesheet" />
    <link href="/css/music-player.css" rel="stylesheet" />
    <link href="/css/vercel.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/img/padify-apple-icon.png" />
    <link rel="mask-icon" href="/img/icon-mask.svg" color="black" />
    <!-- for Facebook -->
    <meta property="og:title" content="Padify — Offline capable" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Padify is an offline-capable notepad powered by ServiceWorker. It's quick, distraction-free, dark mode enabled, mobile compatible(Android, iOS) and minimalist in nature."
    />
    <!-- for Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Padify — Offline capable" />
    <meta
      property="twitter:description"
      content="Padify is an offline-capable notepad powered by ServiceWorker. It's quick, distraction-free, dark mode enabled, mobile compatible(Android, iOS) and minimalist in nature."
    />

    <script>
      if (localStorage.getItem('mode')) {
        if (localStorage.getItem('mode') == 'dark') {
          document.body.classList.add('dark');
          document.querySelector('.navbar').classList.remove('navbar-default');
        } else {
          document.body.classList.remove('dark');
          document.querySelector('.navbar').classList.add('navbar-default');
        }
      } else {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.body.classList.add('dark');
          document.querySelector('.navbar').classList.remove('navbar-default');
        } else {
          document.body.classList.remove('dark');
          document.querySelector('.navbar').classList.add('navbar-default');
        }
      }
    </script>
