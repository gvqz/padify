    <!--
      Stylesheets, in strict cascade order: tokens.css (design tokens,
      loaded first so every later file can consume them), the vendored
      Bootstrap fork, then the app areas split out of the old monolithic
      style.css (base -> editor -> navbar -> components -> timer ->
      effects -> switches -> animations -> fonts), then the feature
      stylesheets, and the vercel design system last — split into its
      17 sections (css/vercel/01..17), so a settings tweak touches one
      small file instead of the most-churned file in the repo. Part 16
      is the editor shell (the app's core layout, once misfiled under
      "accessibility"); part 17 is the reduced-motion accessibility
      block, re-cut after the shell — the halves share no selectors, so
      the swap from the monolith's internal order is cascade-neutral.
    -->

    <link href="/css/bootstrap.min.css" rel="stylesheet" />

  <body>
    <!--#include src/ui/topbar.html -->

    <div id="breakVeil" class="break-veil" aria-hidden="true"></div>

    <!-- Voice typing live bar (Web Speech API) -->
    <div id="voiceBar" class="voice-bar" hidden role="status" aria-live="polite">
      <span class="voice-bar-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="voice-bar-text" id="voiceBarText">Listening…</span>
      <button type="button" id="voiceBarStop" class="voice-bar-stop">Done</button>
    </div>

    <!--#include src/ui/editor-shell.html -->

    <script>
      // Pre-paint theme: avoids the dark→light flash before app.ts boots.
      // Null-guard every .navbar reference — a malformed SSI include could
      // leave the navbar absent at this point, and the inline script throwing
      // would leave dark mode half-applied (no recovery until app.ts runs).
      (function () {
        var stored = localStorage.getItem('mode');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = stored ? stored === 'dark' : prefersDark;
        if (dark) {
          document.body.classList.add('dark');
          var n = document.querySelector('.navbar');
          if (n) n.classList.remove('navbar-default');
        } else {
          document.body.classList.remove('dark');
          var n2 = document.querySelector('.navbar');
          if (n2) n2.classList.add('navbar-default');
        }
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
