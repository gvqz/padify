<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; background: #fff; color: #171717; margin: 24px; }
  h2 { font-size: 14px; margin: 24px 0 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  .row { display: flex; gap: 28px; align-items: center; margin: 10px 0; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell .sizes { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #eee; border-radius: 8px; }
  .lbl { font-size: 11px; color: #666; }
  svg { display: block; }
  /* simulate the real toolbar chip */
  .chip { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:6px; background:#f5f5f5; }
</style>
</head>
<body>

<h2>Highlighter refined</h2>
<div class="row">
  <div class="cell"><div class="sizes"><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 4.5 5 5L9 20H4v-5z"/><path d="M3 22h10" stroke-width="2.6"/></svg>
  </span><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4.5 4.5L9.5 19.5H5.5v-4z"/><path d="M3 22h9" stroke-width="2.6"/></svg>
  </span><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4.5 4.5L9.5 19.5H5.5v-4z"/><path d="M12.6 7.4l4 4" opacity=".5"/><path d="M3 22h9" stroke-width="2.6"/></svg>
  </span></div><span class="lbl">v1 / v2 / v2+fold</span></div>
</div>

<h2>Clear formatting refined</h2>
<div class="row">
  <div class="cell"><div class="sizes"><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M12 5v9"/><path d="m9.5 15 5 5M14.5 15l-5 5" opacity=".55"/></svg>
  </span><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14"/><path d="M12 4v9.5"/><path d="m9 15.5 6 5M15 15.5l-6 5" opacity=".55"/></svg>
  </span><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14"/><path d="M12 4v9"/><path d="m9.7 14.6 4.6 4.8M14.3 14.6l-4.6 4.8" opacity=".6"/></svg>
  </span></div><span class="lbl">v1 / v2 / v3</span></div>
</div>

<h2>Numbered list final check (in-chip)</h2>
<div class="row">
  <div class="cell"><div class="sizes"><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6H21M10.5 12H21M10.5 18H21"/><path d="M4.6 4.9 6.2 4v4.6M4.4 8.6h3.6" stroke-width="1.7"/><path d="M4.1 10.5c.3-.8 1-1.3 1.9-1.3 1 0 1.8.6 1.8 1.5 0 1.8-3.7 1.9-3.7 3.6h3.8" stroke-width="1.7"/><path d="M4.2 16.4c.3-.7.9-1.1 1.7-1.1 1 0 1.7.5 1.7 1.2 0 .7-.7 1.2-1.6 1.2.9 0 1.8.6 1.8 1.4 0 .8-.8 1.3-1.8 1.3-.9 0-1.5-.3-1.8-1" stroke-width="1.7"/></svg>
  </span><span class="chip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10.3 6H6.7C5.2 6 4 7.2 4 8.7v3.6C4 13.8 5.2 15 6.7 15h1.9c-.3 1.8-1.5 3-3.3 3.4l.4 1.6c3.1-.6 5.1-3 5.1-6.5V7.7C10.8 6.8 10.6 6 10.3 6z"/><path d="M19.5 6h-3.6C14.4 6 13.2 7.2 13.2 8.7v3.6c0 1.5 1.2 2.7 2.7 2.7h1.9c-.3 1.8-1.5 3-3.3 3.4l.4 1.6c3.1-.6 5.1-3 5.1-6.5V7.7c0-.9-.2-1.7-.5-2.4z"/></svg>
  </span></div><span class="lbl">numbered / quote chips</span></div>
</div>

<h2>Row context — full group at real size</h2>
<div class="row">
  <div style="display:flex; gap:2px; padding:6px 10px; border:1px solid #eee; border-radius:10px; align-items:center">
    <!-- lists group -->
    <span class="chip" title="Bulleted list"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6H21M10.5 12H21M10.5 18H21"/><path d="M4.6 4.9 6.2 4v4.6M4.4 8.6h3.6" stroke-width="1.7"/><path d="M4.1 10.5c.3-.8 1-1.3 1.9-1.3 1 0 1.8.6 1.8 1.5 0 1.8-3.7 1.9-3.7 3.6h3.8" stroke-width="1.7"/><path d="M4.2 16.4c.3-.7.9-1.1 1.7-1.1 1 0 1.7.5 1.7 1.2 0 .7-.7 1.2-1.6 1.2.9 0 1.8.6 1.8 1.4 0 .8-.8 1.3-1.8 1.3-.9 0-1.5-.3-1.8-1" stroke-width="1.7"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6h10M11 12h10M11 18h10"/><path d="m7 9-3 3 3 3"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6h10M11 12h10M11 18h10"/><path d="m4 9 3 3-3 3"/></svg></span>
    <span style="width:1px;height:20px;background:#e5e5e5;margin:0 6px"></span>
    <!-- quote / code / hr -->
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10.3 6H6.7C5.2 6 4 7.2 4 8.7v3.6C4 13.8 5.2 15 6.7 15h1.9c-.3 1.8-1.5 3-3.3 3.4l.4 1.6c3.1-.6 5.1-3 5.1-6.5V7.7C10.8 6.8 10.6 6 10.3 6z"/><path d="M19.5 6h-3.6C14.4 6 13.2 7.2 13.2 8.7v3.6c0 1.5 1.2 2.7 2.7 2.7h1.9c-.3 1.8-1.5 3-3.3 3.4l.4 1.6c3.1-.6 5.1-3 5.1-6.5V7.7c0-.9-.2-1.7-.5-2.4z"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16"/><path d="M8 6h8" opacity=".5"/><path d="M8 18h8" opacity=".5"/></svg></span>
    <span style="width:1px;height:20px;background:#e5e5e5;margin:0 6px"></span>
    <!-- highlight / clear -->
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 4.5 4.5L9.5 19.5H5.5v-4z"/><path d="M3 22h9" stroke-width="2.6"/></svg></span>
    <span class="chip"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14"/><path d="M12 4v9"/><path d="m9.7 14.6 4.6 4.8M14.3 14.6l-4.6 4.8" opacity=".6"/></svg></span>
  </div>
</div>

</body>
</html>
