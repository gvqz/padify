<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="A full drawing canvas with shapes, arrows, text and more — part of Padify.">
    <meta name="application-name" content="Padify Drawingpad" />
    <meta name="theme-color" content="#343a40">

    <meta property="og:title" content="Padify / Drawingpad" />
    <meta property="og:type" content="article" />
    <meta property="og:description" content="A full drawing canvas with shapes, arrows, text and more — part of Padify." />

    <title>Drawingpad | Padify</title>
    <style>
        :root {
            --pad-border: #e6e4e4;
            --pad-fg: #171717;
            --pad-fg-muted: #666666;
            --pad-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --pad-border: #262626;
                --pad-fg: #ededed;
                --pad-fg-muted: #a1a1a1;
                --pad-bg: #000000;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--pad-bg);
            color: var(--pad-fg);
        }

        .pad-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            border-bottom: 1px solid var(--pad-border);
            background: var(--pad-bg);
            z-index: 10;
        }

        .pad-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--pad-fg);
            text-decoration: none;
            white-space: nowrap;
        }

        .pad-brand .slash {
            color: var(--pad-fg-muted);
            font-weight: 400;
        }

        .pad-brand .tool {
            font-weight: 500;
            color: var(--pad-fg-muted);
        }

        .pad-brand:hover { text-decoration: none; }

        .pad-actions { display: flex; align-items: center; gap: 8px; }

        .pad-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--pad-fg-muted);
            background: transparent;
            border: 1px solid var(--pad-border);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: color 120ms ease, border-color 120ms ease;
        }

        .pad-btn:hover {
            color: var(--pad-fg);
            border-color: var(--pad-fg-muted);
        }

        #drawingRoot {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .pad-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pad-fg-muted);
            font-size: 14px;
        }

        /* Strip every outbound vendor link — the canvas stays fully usable
           (file open/save/export/tools), it just carries no external links. */
        .dropdown-menu .dropdown-menu-group:has(a[href*="excalidraw"]),
        .dropdown-menu .dropdown-menu-group:has(a[href*="discord.gg"]),
        .dropdown-menu .dropdown-menu-group:has(a[href*="twitter.com"]),
        .HelpDialog .HelpDialog__header {
            display: none !important;
        }
    </style>
</head>
<body>
    <nav class="pad-navbar">
        <a class="pad-brand" href="/">
            <span>Padify</span>
            <span class="slash">/</span>
            <span class="tool">Drawingpad</span>
        </a>
        <div class="pad-actions">
            <button type="button" class="pad-btn" id="clearCanvasBtn" title="Clear the whole canvas">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                Clear canvas
            </button>
        </div>
    </nav>

    <div id="drawingRoot">
        <div class="pad-loading" id="padLoading">Loading the drawing canvas…</div>
    </div>

    <script>
        // Serve every canvas asset (fonts, locale chunks) from this origin —
        // nothing is fetched from the vendor's CDN.
        window.EXCALIDRAW_ASSET_PATH = '/drawingpad/vendor/';
    </script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/excalidraw.production.min.js"></script>
    <script src="cloud.js"></script>
    <script src="app.js"></script>
</body>
</html>
