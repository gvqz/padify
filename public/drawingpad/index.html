<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="A full drawing canvas with shapes, arrows, text and more — part of Padify.">
    <meta name="application-name" content="Padify Drawingpad" />
    <meta name="theme-color" content="#343a40">

    <meta property="og:title" content="Padify / Drawingpad" />
    <meta property="og:type" content="article" />
    <meta property="og:description" content="A full drawing canvas with shapes, arrows, text and more — part of Padify." />

    <title>Drawingpad | Padify</title>
    <style>
        :root {
            --pad-border: #e6e4e4;
            --pad-fg: #171717;
            --pad-fg-muted: #666666;
            --pad-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --pad-border: #262626;
                --pad-fg: #ededed;
                --pad-fg-muted: #a1a1a1;
                --pad-bg: #000000;
            }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--pad-bg);
            color: var(--pad-fg);
        }

        .pad-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            border-bottom: 1px solid var(--pad-border);
            background: var(--pad-bg);
            z-index: 10;
        }

        .pad-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--pad-fg);
            text-decoration: none;
            white-space: nowrap;
        }

        .pad-brand .slash {
            color: var(--pad-fg-muted);
            font-weight: 400;
        }

        .pad-brand .tool {
            font-weight: 500;
            color: var(--pad-fg-muted);
        }

        .pad-brand:hover { text-decoration: none; }

        .pad-actions { display: flex; align-items: center; gap: 8px; }

        .pad-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12.5px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--pad-fg-muted);
            background: transparent;
            border: 1px solid var(--pad-border);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: color 120ms ease, border-color 120ms ease;
        }

        .pad-btn:hover {
            color: var(--pad-fg);
            border-color: var(--pad-fg-muted);
        }

        #drawingRoot {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .pad-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pad-fg-muted);
            font-size: 14px;
        }

        /* -----------------------------------------------------------------
           Temporary PIN gate — the drawing pad is a work in progress.
           ----------------------------------------------------------------- */
        body.locked #drawingRoot {
            visibility: hidden;
        }

        .padlock-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--pad-bg);
            transition: opacity 240ms ease;
        }

        .padlock-overlay.leaving {
            opacity: 0;
        }

        .padlock-overlay.shake {
            animation: padlock-shake 380ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes padlock-shake {
            10%, 90% { transform: translateX(-1px); }
            20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); }
            40%, 60% { transform: translateX(4px); }
        }

        .padlock-card {
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .padlock-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            margin-bottom: 18px;
            border: 1px solid var(--pad-border);
            border-radius: 14px;
            color: var(--pad-fg-muted);
        }

        .padlock-title {
            margin: 0 0 6px;
            font-size: 19px;
            font-weight: 700;
            color: var(--pad-fg);
        }

        .padlock-subtitle {
            margin: 0 0 22px;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--pad-fg-muted);
        }

        .padlock-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .padlock-dot {
            width: 13px;
            height: 13px;
            border: 1.5px solid var(--pad-border);
            border-radius: 50%;
            transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
        }

        .padlock-dot.filled {
            background: var(--pad-fg);
            border-color: var(--pad-fg);
            transform: scale(1.08);
        }

        .padlock-hint {
            min-height: 18px;
            margin: 0 0 16px;
            font-size: 12px;
            color: var(--pad-fg-muted);
        }

        .padlock-hint.error {
            color: #d92d20;
        }

        @media (prefers-color-scheme: dark) {
            .padlock-hint.error { color: #f97066; }
        }

        .padlock-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 240px;
            margin: 0 auto;
        }

        .padlock-key {
            height: 52px;
            font-size: 17px;
            font-weight: 500;
            color: var(--pad-fg);
            background: var(--pad-bg);
            border: 1px solid var(--pad-border);
            border-radius: 12px;
            cursor: pointer;
            transition: border-color 120ms ease, background 120ms ease;
            touch-action: manipulation;
        }

        .padlock-key:hover {
            border-color: var(--pad-fg-muted);
        }

        .padlock-key:active {
            background: var(--pad-border);
        }
    </style>
</head>
<body class="locked">
    <nav class="pad-navbar">
        <a class="pad-brand" href="/">
            <span>Padify</span>
            <span class="slash">/</span>
            <span class="tool">Drawingpad</span>
        </a>
    </nav>

    <div id="drawingRoot">
        <div class="pad-loading" id="padLoading">The drawing canvas is being rebuilt — it'll be back soon.</div>
    </div>

    <!-- Temporary PIN gate: the drawing pad is a work in progress. -->
    <div class="padlock-overlay" id="padLock" role="dialog" aria-modal="true" aria-label="Drawing pad locked">
        <div class="padlock-card">
            <span class="padlock-badge" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg>
            </span>
            <h1 class="padlock-title">Drawingpad is locked</h1>
            <p class="padlock-subtitle">The canvas is being rebuilt from the ground up.<br>Enter the PIN to open the pad shell.</p>
            <div class="padlock-dots" id="padLockDots" aria-hidden="true">
                <span class="padlock-dot"></span>
                <span class="padlock-dot"></span>
                <span class="padlock-dot"></span>
                <span class="padlock-dot"></span>
            </div>
            <p class="padlock-hint" id="padLockHint">&nbsp;</p>
            <div class="padlock-keypad" id="padLockKeypad">
                <button type="button" class="padlock-key" data-key="1">1</button>
                <button type="button" class="padlock-key" data-key="2">2</button>
                <button type="button" class="padlock-key" data-key="3">3</button>
                <button type="button" class="padlock-key" data-key="4">4</button>
                <button type="button" class="padlock-key" data-key="5">5</button>
                <button type="button" class="padlock-key" data-key="6">6</button>
                <button type="button" class="padlock-key" data-key="7">7</button>
                <button type="button" class="padlock-key" data-key="8">8</button>
                <button type="button" class="padlock-key" data-key="9">9</button>
                <span></span>
                <button type="button" class="padlock-key" data-key="0">0</button>
                <button type="button" class="padlock-key" data-key="back" aria-label="Backspace">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H8.5L2 12l6.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1Z"/><path d="m12 9 6 6M18 9l-6 6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- PIN gate — the drawing pad shell stays behind it while the canvas
         is rebuilt. -->
    <script src="lock.js"></script>
</body>
</html>
