name: CI

# The gate a push must pass before the deploy workflow will ship it.
#
# SHAPE (rebuilt 2026-11-25 — "having to wait 1+ hours after every tiny
# change is extremely unproductive"):
#   - docs-only pushes (README, the issue ledger, qa findings, the notes
#     under docs/) skip CI entirely — they change nothing the app ships;
#   - a newer push to the same ref CANCELS the run it supersedes — the
#     queue of stale full suites behind a burst of fixes was the loudest
#     cost of every iteration;
#   - bun's install cache and Playwright's browser cache persist between
#     runs — cold installs were minutes tacked onto every job;
#   - the e2e suite SHARDS across three runners: the 347-spec suite took
#     20.6 minutes on one machine — the longest pole by far;
#   - the gates run as parallel jobs, not serial steps of one job: a
#     formatting nit fails in two minutes without waiting on e2e.
#
# The deploy workflow still fires only on a SUCCESSFUL CI completion, so
# a skipped (docs-only) run ships nothing — nothing changed in dist.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'qa/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'qa/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, Lint, Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Bun owns the lockfile: bun install --frozen-lockfile keeps CI in
      # sync with local development. Everything else runs on Node/npm —
      # running vitest under Bun's runtime shim is a compatibility
      # minefield (jsdom 27 pulls undici's CacheStorage, which Bun's
      # interposed undici breaks with "webidl.util.markAsUncloneable is
      # not a function" depending on the Bun build).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      # The API is its own package with its own tsconfig (Bun's runtime
      # types, see server/tsconfig.json) — the root typecheck does not
      # see it, so it gets its own gate.
      - name: Typecheck the API server
        run: npx tsc -p server/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      # No dist artifact upload: nothing downstream downloads it (the
      # deploy workflow builds its own), and every run's 7-day artifact
      # exhausted the account's storage quota (63 artifacts, ~1.4 GB when
      # purged 2026-10-14) — builds failed at the upload step on green
      # code. Grab dist from a run's logs or rebuild locally if needed.

  e2e:
    name: E2E (Playwright, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Same toolchain split as the other jobs: Bun owns the lockfile,
      # Node runs the tooling (Vite dev server + Playwright).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Restore Playwright's browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright's Chromium (skips the download on a cache hit)
        run: npx playwright install --with-deps chromium

      # The suite starts its own servers (playwright.config.ts webServer):
      # Vite on :5199 plus the real API on :3041, running against a
      # throwaway SQLite DB in a per-run temp dir. The cloud-api spec
      # signs up, pushes, and pulls through that API — the wire protocol
      # is pinned in CI, not just the offline core. Each shard runs the
      # whole stack on its own runner.
      - name: Run the e2e suite (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # THE PROD LANE: the same e2e suite, against the PRODUCTION artifact.
  #
  # The dist-patch era shipped its worst bug through exactly this gap: the
  # dev-server suite was green while the deployed bundle crashed (the
  # vendor resolved differently once compiled — the netlify hamburger
  # crash, React #130 on every menu open). This lane builds the real dist
  # (typecheck + bundle + headers + SW) and runs the whole suite against
  # `vite preview` of it: hashed chunks, the CSP meta, the SW, the copied
  # fonts — the exact artifact a deployment ships. The lane already paid
  # for itself on its first run (the shell-refresh ack bug it caught).
  # One runner, one build (sharding would rebuild per shard); the dev lane
  # stays the sharded fast-feedback path.
  e2e-prod:
    name: E2E against the production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Restore Playwright's browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright's Chromium (skips the download on a cache hit)
        run: npx playwright install --with-deps chromium

      # The webServer config builds (npm run build) and serves dist/ via
      # vite preview — see playwright.config.ts's PADIFY_E2E_TARGET=prod.
      - name: Run the e2e suite against the production build
        run: npx playwright test
        env:
          PADIFY_E2E_TARGET: prod
