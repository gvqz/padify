name: Commit author policy

# Every commit must be authored and committed as the JellyBean identity:
#
#   author    JellyBean <119090177+gvqz@users.noreply.github.com>
#   committer JellyBean <119090177+gvqz@users.noreply.github.com>
#
# The policy (and how to set it locally) is documented in CONTRIBUTING.md.
#
# Exemption: commits created by GitHub itself (merge commits, squash merges
# and "Update branch" clicks performed through the web UI) have
# committer "GitHub <noreply@github.com>". Their author name comes from the
# profile display name at merge time, so only the author *email* is enforced
# for those. Everything pushed from a local clone or bot must match exactly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce commit identity
    runs-on: ubuntu-latest
    env:
      # Edit these two values if the required identity ever changes.
      REQUIRED_NAME: JellyBean
      REQUIRED_EMAIL: 119090177+gvqz@users.noreply.github.com
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history so the commit range can be resolved.
          fetch-depth: 0
          # For PRs, inspect the real head commit, not the synthetic merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Collect the commits to verify
        id: commits
        run: |
          set -euo pipefail
          shas=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Exact: every commit on the PR branch that is not on the base.
            base="origin/${{ github.event.pull_request.base.ref }}"
            shas=$(git rev-list "$base..HEAD")
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ "$before" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$before" 2>/dev/null; then
              # Exact: the commits that arrived in this fast-forward push.
              shas=$(git rev-list "$before..$after")
            else
              # Force push (or brand-new branch): the before-sha is gone, so
              # the push event's commit list is the best available source.
              shas=$(jq -r '.commits[]?.sha // empty' "$GITHUB_EVENT_PATH")
              if [ -z "$shas" ]; then
                echo "Could not resolve a commit range (force push with no commit list); nothing to verify."
              fi
            fi
          fi
          {
            echo "shas<<EOF"
            echo "$shas"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify author and committer identities
        run: |
          set -euo pipefail
          checked=0
          failed=0

          while read -r sha; do
            [ -n "$sha" ] || continue
            checked=$((checked + 1))

            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            committer_name=$(git show -s --format='%cn' "$sha")
            committer_email=$(git show -s --format='%ce' "$sha")
            subject=$(git show -s --format='%s' "$sha")

            # GitHub web-flow commits (UI merges, squash merges, branch updates).
            if [ "$committer_email" = "noreply@github.com" ]; then
              if [ "$author_email" != "$REQUIRED_EMAIL" ]; then
                echo "FAIL $sha — author email '$author_email' is not '$REQUIRED_EMAIL' ($subject)"
                failed=1
              fi
              continue
            fi

            if [ "$author_name" != "$REQUIRED_NAME" ]; then
              echo "FAIL $sha — author name '$author_name' is not '$REQUIRED_NAME' ($subject)"
              failed=1
            fi
            if [ "$author_email" != "$REQUIRED_EMAIL" ]; then
              echo "FAIL $sha — author email '$author_email' is not '$REQUIRED_EMAIL' ($subject)"
              failed=1
            fi
            if [ "$committer_name" != "$REQUIRED_NAME" ] || [ "$committer_email" != "$REQUIRED_EMAIL" ]; then
              echo "FAIL $sha — committer '$committer_name <$committer_email>' is not '$REQUIRED_NAME <$REQUIRED_EMAIL>' ($subject)"
              failed=1
            fi
          done <<< "${{ steps.commits.outputs.shas }}"

          if [ "$checked" -eq 0 ]; then
            echo "No commits in range — policy passes trivially."
            exit 0
          fi

          if [ "$failed" -ne 0 ]; then
            echo
            echo "Commit identity policy violated ($checked commit(s) checked)."
            echo "Fix your local identity and re-commit:"
            echo "  git config user.name  \"$REQUIRED_NAME\""
            echo "  git config user.email \"$REQUIRED_EMAIL\""
            echo "See CONTRIBUTING.md ('Commit identity') for details."
            exit 1
          fi

          echo "OK — all $checked checked commit(s) carry the identity '$REQUIRED_NAME <$REQUIRED_EMAIL>'."
